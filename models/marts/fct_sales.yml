version: 2

models:
  - name: fct_sales
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales')
                field: order_id
      - name: product_id
        tests:
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: unit_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_sales_amount
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: product_line
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["Shipped"]
      - name: city
        tests:
          - not_null
      - name: country
        tests:
          - not_null
      - name: percentage_share_by_category
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true